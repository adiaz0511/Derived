name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      unsigned:
        description: "Build an unsigned validation artifact without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install deterministic DMG builder
        run: |
          python3 -m venv "$RUNNER_TEMP/derived-release-venv"
          "$RUNNER_TEMP/derived-release-venv/bin/pip" install -r requirements-release.txt
          echo "DMGBUILD_BIN=$RUNNER_TEMP/derived-release-venv/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Resolve release settings
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UNSIGNED: ${{ inputs.unsigned }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$TAG_NAME" == v* ]] || exit 1
            echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "unsigned=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "unsigned=$INPUT_UNSIGNED" >> "$GITHUB_OUTPUT"
          fi

      - name: Test Swift package
        run: swift test

      - name: Test MCP protocol and CLI
        run: scripts/test-agent-protocol.sh

      - name: Test installer and publication metadata
        run: |
          scripts/test-agent-tools-install.sh
          scripts/test-agent-tools-update.sh
          scripts/test-publication-metadata.sh

      - name: Validate signing secrets
        if: steps.release.outputs.unsigned != 'true'
        env:
          SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          HOMEBREW_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [[ -n "$SIGNING_CERTIFICATE" ]] || { echo "Missing DEVELOPER_ID_APPLICATION_P12_BASE64" >&2; exit 1; }
          [[ -n "$SIGNING_PASSWORD" ]] || { echo "Missing DEVELOPER_ID_APPLICATION_P12_PASSWORD" >&2; exit 1; }
          [[ -n "$ASC_KEY_ID" ]] || { echo "Missing APP_STORE_CONNECT_API_KEY_ID" >&2; exit 1; }
          [[ -n "$ASC_ISSUER_ID" ]] || { echo "Missing APP_STORE_CONNECT_API_ISSUER_ID" >&2; exit 1; }
          [[ -n "$ASC_PRIVATE_KEY" ]] || { echo "Missing APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" >&2; exit 1; }
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "Missing SPARKLE_EDDSA_PRIVATE_KEY" >&2; exit 1; }
          [[ -n "$HOMEBREW_DEPLOY_KEY" ]] || { echo "Missing HOMEBREW_TAP_DEPLOY_KEY" >&2; exit 1; }

      - name: Install signing certificate and notarization profile
        if: steps.release.outputs.unsigned != 'true'
        env:
          SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/derived-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/derived-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$SIGNING_CERTIFICATE" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$ASC_PRIVATE_KEY" | /usr/bin/base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$SIGNING_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          xcrun notarytool store-credentials derived-ci-notary \
            --key "$notary_key_path" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --keychain "$keychain_path"
          echo "DERIVED_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build unsigned validation DMG
        if: steps.release.outputs.unsigned == 'true'
        run: scripts/build-release-dmg.sh --version "${{ steps.release.outputs.version }}" --architectures universal --unsigned

      - name: Build, sign, and notarize release DMG
        if: steps.release.outputs.unsigned != 'true'
        env:
          DERIVED_NOTARY_PROFILE: derived-ci-notary
          DERIVED_NOTARY_KEYCHAIN: ${{ env.DERIVED_KEYCHAIN_PATH }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          sparkle_key_path="$RUNNER_TEMP/derived-sparkle-private-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$sparkle_key_path"
          chmod 600 "$sparkle_key_path"
          identity="$(security find-identity -v -p codesigning "$DERIVED_KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "Developer ID Application identity was not imported" >&2; exit 1; }
          scripts/build-release-dmg.sh \
            --version "${{ steps.release.outputs.version }}" \
            --architectures universal \
            --sign-identity "$identity" \
            --sparkle-private-key "$sparkle_key_path" \
            --notarize

      - name: Verify portable release checksums
        run: scripts/verify-portable-checksums.sh dist/*.sha256

      - name: Preserve MCP Registry metadata
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Derived-${{ steps.release.outputs.version }}-mcp-registry-metadata
          path: dist/server.json
          if-no-files-found: error

      - name: Upload manual validation artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Derived-${{ steps.release.outputs.version }}-manual
          path: |
            dist/*.dmg
            dist/*.mcpb
            dist/*.sha256
            dist/server.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.mcpb

      - name: Check out Homebrew tap
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          repository: adiaz0511/homebrew-derived
          path: .homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew packages
        if: github.event_name == 'push'
        run: |
          dmg="dist/Derived-${{ steps.release.outputs.version }}-macOS-universal.dmg"
          sha256="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          scripts/update-homebrew-casks.sh \
            --version "${{ steps.release.outputs.version }}" \
            --sha256 "$sha256" \
            --tap-root .homebrew-tap
          git -C .homebrew-tap config user.name "github-actions[bot]"
          git -C .homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .homebrew-tap add Casks
          if ! git -C .homebrew-tap diff --cached --quiet; then
            git -C .homebrew-tap commit -m "Update Derived to ${{ steps.release.outputs.version }}"
            git -C .homebrew-tap push
          fi

      - name: Prepare Sparkle update feed
        if: github.event_name == 'push'
        run: |
          mkdir -p dist/sparkle-site
          cp dist/sparkle/* dist/sparkle-site/
          cp dist/tools-version.json dist/sparkle-site/

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Sparkle update feed
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sparkle-site

  deploy-appcast:
    if: github.event_name == 'push'
    needs: dmg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Sparkle update feed
        id: deployment
        uses: actions/deploy-pages@v4
