name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test command-line and MCP integration
        run: swift test

      - name: Test MCP protocol and CLI entry points
        run: scripts/test-agent-protocol.sh

      - name: Test agent-tool installer and uninstaller
        run: scripts/test-agent-tools-install.sh

      - name: Test publication metadata
        run: scripts/test-publication-metadata.sh

      - name: Build and package release agent tools
        run: |
          scripts/package-agent-tools.sh 1.0.4
          test -f "dist/DerivedAgentTools-1.0.4-macOS-$(uname -m).tar.gz"

      - name: Build MCP bundle
        run: |
          scripts/package-mcpb.sh 1.0.4
          test -f "dist/Derived-MCP-1.0.4-macOS-$(uname -m).mcpb"
          scripts/verify-portable-checksums.sh "dist/Derived-MCP-1.0.4-macOS-$(uname -m).mcpb.sha256"

      - name: Verify the existing application
        run: scripts/verify-app-regression.sh
