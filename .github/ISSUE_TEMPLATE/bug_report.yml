name: Bug report
description: Report incorrect behavior or a regression.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private paths or security vulnerabilities. Report vulnerabilities through GitHub private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Derived version
      placeholder: Commit or release version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS and Xcode versions
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: State what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Provide a minimal sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove usernames, private paths, project names, and other personal information.
      render: shell
